llm:
  provider: dashscope
  model: qwen3.5-35b-a3b
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: DASHSCOPE_API_KEY
  max_tokens: 8192
  temperature: 0.0
  context_window: 262144  # Qwen3.5-35B-A3B 262K context

agent:
  max_iterations: 8
  min_iterations: 1
  max_retries: 2
  backtrack_limit: 3
  stagnation_threshold: 2

sandbox:
  timeout_seconds: 120
  max_memory_mb: 1024

synthesizer:
  mode: kdd
  normalize_numbers: true

eval:
  kdd_gold_dir: public
  dabstep_dir: data/dabstep

batch:
  # Local dev (DashScope): parallel=10 tested OK on 50 KDD tasks (~25 min).
  # KDD Cup eval (internal Qwen, 16 vCPU, 64GB, 12h for ~400 tasks):
  # conservative parallel=8 — leaves 2 vCPU headroom and 20% margin under
  # unknown rate limits. Estimated wall clock ~50 min on 400 tasks,
  # well under 12h cap. Bump after first submission confirms slack.
  parallel: 8
