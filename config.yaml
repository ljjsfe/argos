llm:
  provider: dashscope
  model: qwen3.5-35b-a3b
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: DASHSCOPE_API_KEY
  max_tokens: 8192
  temperature: 0.0
  context_window: 262144  # Qwen3.5-35B-A3B 262K context

agent:
  max_iterations: 8
  min_iterations: 1
  max_retries: 2
  backtrack_limit: 3
  stagnation_threshold: 2

sandbox:
  timeout_seconds: 120
  max_memory_mb: 1024

synthesizer:
  mode: kdd
  normalize_numbers: true

eval:
  kdd_gold_dir: public
  dabstep_dir: data/dabstep

batch:
  # Kimi Tier 2: concurrent 100, RPM 500, TPM 3M/min
  # At parallel 10: ~12 RPM, ~147K TPM — well within limits
  # Wall clock for 20 dev tasks: ~23 min
  parallel: 10
