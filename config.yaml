llm:
  provider: dashscope
  # Per KDD Cup 2026 spec §5.2: API URL / API Key must NOT be hardcoded
  # in code, config files, or images. Read at runtime from env vars
  # (MODEL_API_URL / MODEL_API_KEY / MODEL_NAME — injected by evaluator).
  # For local dev, set them in .env (gitignored).
  api_key_env: DASHSCOPE_API_KEY
  max_tokens: 8192
  temperature: 0.0
  context_window: 262144  # Qwen3.5-35B-A3B 262K context

agent:
  max_iterations: 8
  min_iterations: 1
  max_retries: 2
  backtrack_limit: 3
  stagnation_threshold: 2

sandbox:
  timeout_seconds: 120
  max_memory_mb: 1024

synthesizer:
  mode: kdd
  normalize_numbers: true

eval:
  kdd_gold_dir: public
  dabstep_dir: data/dabstep

heavy_mode:
  # HeavySkill failure-triggered K-trajectory + deliberator.
  # Reference: arXiv 2605.02396 "HeavySkill: Heavy Thinking as the Inner Skill".
  # Default OFF for backward compatibility. Enable via CLI --heavy-mode auto
  # or set enabled: true here.
  enabled: false
  trigger: auto              # auto | always | off
  k_trajectories: 3
  trajectory_temperatures: [0.0, 0.7, 0.7]
  # deliberator_shuffle_seed: leave null for production; set int for repro

batch:
  # Local dev (DashScope): parallel=10 tested OK on 50 KDD tasks (~25 min).
  # KDD Cup eval (internal Qwen, 16 vCPU, 64GB, 12h for ~400 tasks):
  # conservative parallel=8 — leaves 2 vCPU headroom and 20% margin under
  # unknown rate limits. Estimated wall clock ~50 min on 400 tasks,
  # well under 12h cap. Bump after first submission confirms slack.
  parallel: 8
